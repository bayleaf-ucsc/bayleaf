name: "BayLeaf Sandboxes"
description: "Bug reports, feature requests, service proposals, data privacy questions, or anything else about sandboxes at sandbox.bayleaf.dev"
labels: ["sandbox"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file an issue about [BayLeaf Sandboxes](https://sandbox.bayleaf.dev)!

        This covers your sandbox workspace, managed services (OpenChamber, code-server,
        Files, Shell), sign-in, data retention and privacy questions, proposals for new
        managed services, and anything else related to the sandbox experience. Bug
        reports, feature requests, and clarifying questions are all welcome.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of issue is this?
      options:
        - Bug report
        - Feature request / enhancement
        - New managed-service proposal
        - Data privacy question
        - General question
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Tell us what happened, what you expected, or what you'd like to see.
        Be as specific as you can: which service, what you were doing, browser, etc.
      placeholder: "e.g. When I clicked Open on the code-server card, I got an error saying …"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (for bugs)
      description: If this is a bug, walk us through how to trigger it.
      placeholder: |
        1. Go to sandbox.bayleaf.dev
        2. Sign in and click Open on a service card
        3. See error

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: |
        Please attach one or more screenshots if possible — they often reveal
        details (error banners, card state, timestamps) that are easy
        to overlook in a text description. Drag and drop images here or paste from
        your clipboard.
      placeholder: "Drag and drop images here"

  - type: input
    id: browser
    attributes:
      label: Browser & OS (for bugs)
      description: "e.g. Chrome 130 on macOS, Firefox on Android, Safari on iOS"
      placeholder: "Chrome 130, macOS Sequoia"
