[package]
name = "pouch-sendme-experiment"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
console_error_panic_hook = "0.1"
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.104", default-features = false }
js-sys = "0.3"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = true
